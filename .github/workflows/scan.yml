name: Browser Radar - weekly discovery
on:
  push:
    branches: [main]
    paths:
      - 'scripts/scan.mjs'
      - 'scripts/scan.test.mjs'
      - 'site/catalog.mjs'
      - 'site/data/browsers.json'
      - '.github/workflows/scan.yml'
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: browser-radar-data
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit tests and privacy safeguards
        run: node --test scripts/*.test.mjs
      - name: Search GitHub and update observations
        id: scan
        run: node scripts/scan.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit public discovery and metrics only
        if: ${{ !cancelled() && (steps.scan.outcome == 'success' || steps.scan.outcome == 'failure') }}
        run: |
          if git diff --quiet -- site/data/discovered.json site/data/metrics.json; then
            echo "No changes"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add site/data/discovered.json site/data/metrics.json
          git commit -m 'chore: refresh browser discovery'
          git push
